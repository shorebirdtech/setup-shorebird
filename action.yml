name: Setup Shorebird
description: Install the Shorebird CLI

branding:
  icon: check-circle
  color: yellow

inputs:
  cache:
    description: "Cache the Shorebird installation and artifacts. Default: false"
    required: false
    default: "false"
  shorebird-version:
    description: >-
      Not recommended. Pins the Shorebird CLI release to install (the version
      `shorebird --version` prints, e.g. 1.6.125; not a Flutter version).
      Defaults to the latest stable release. Shorebird's servers stop
      accepting old CLI versions over time, so a pinned version will
      eventually break. To build with a specific Flutter version, pass
      --flutter-version to `shorebird release` instead.
    required: false
    default: ""
  flutter-version:
    description: >-
      Also install Shorebird's Flutter, precache its build artifacts, and put
      `flutter` and `dart` on PATH: a Flutter version (e.g. 3.38.5), a
      commit, or `latest` for the Flutter this Shorebird CLI builds with, as
      `shorebird release --flutter-version` takes it (not `system` or `fvm`).
      Needs Shorebird CLI 1.6.148 or later. Default: none, Flutter isn't put
      on PATH.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Determine Install Path (MacOS / Linux)
      if: ${{ runner.os != 'Windows' }}
      id: install-path
      run: |
        install_path=$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.shorebird" || printf %s "${XDG_CONFIG_HOME}/shorebird")
        echo "path=$install_path" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Determine Install Path (Windows)
      if: ${{ runner.os == 'Windows' }}
      id: install-path-windows
      run: |
        $install_path = [IO.Path]::Combine($home, ".shorebird")
        Write-Output "path=$install_path" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # Without a pinned version the installer takes the latest stable release,
    # so the cache key has to name it. Otherwise a cache saved under an older
    # release keeps restoring that release after a new one ships.
    - name: 🔎 Resolve Stable Release
      if: ${{ inputs.cache == 'true' && inputs.shorebird-version == '' }}
      id: stable
      run: |
        sha=$(git ls-remote https://github.com/shorebirdtech/shorebird.git refs/heads/stable | cut -f1)
        if [ -z "$sha" ]; then
          echo "Could not resolve the Shorebird stable branch." >&2
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: 💾 Configure Shorebird Cache
      if: ${{ inputs.cache == 'true' }}
      id: cache-shorebird
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.install-path.outputs.path || steps.install-path-windows.outputs.path }}
        # With flutter-version the installation also holds Flutter's precached
        # artifacts, so name the Flutter in the key. Without it the key stays
        # as it was, so existing caches keep hitting.
        key: shorebird-cache-key-${{ runner.os }}-${{ runner.arch }}-${{ inputs.shorebird-version || steps.stable.outputs.sha }}${{ inputs.flutter-version != '' && format('-flutter-{0}', inputs.flutter-version) || '' }}

    - name: 🐦 Install Shorebird (MacOS / Linux)
      if: ${{ steps.cache-shorebird.outputs.cache-hit != 'true' && inputs.shorebird-version == '' && runner.os != 'Windows' }}
      run: |
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash -s -- --force
      shell: bash

    - name: 🐦 Install Shorebird (Windows)
      if: ${{ steps.cache-shorebird.outputs.cache-hit != 'true' && inputs.shorebird-version == '' && runner.os == 'Windows' }}
      run: |
        Set-ExecutionPolicy RemoteSigned -scope CurrentUser # Needed to execute remote scripts
        iwr -UseBasicParsing 'https://raw.githubusercontent.com/shorebirdtech/install/main/install.ps1'|iex
      shell: pwsh

    # A pinned version skips the installer, which would first download the
    # latest CLI and its Flutter. Clone the CLI at the release tag instead,
    # as the installer does for the stable branch.
    - name: 📌 Install Pinned Shorebird (MacOS / Linux)
      if: ${{ steps.cache-shorebird.outputs.cache-hit != 'true' && inputs.shorebird-version != '' && runner.os != 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path.outputs.path }}
        VERSION: ${{ inputs.shorebird-version }}
      run: |
        rm -rf "$INSTALL_PATH"
        git clone --quiet -c advice.detachedHead=false --branch "v${VERSION#v}" https://github.com/shorebirdtech/shorebird.git "$INSTALL_PATH"
        "$INSTALL_PATH/bin/shorebird" --version
      shell: bash

    - name: 📌 Install Pinned Shorebird (Windows)
      if: ${{ steps.cache-shorebird.outputs.cache-hit != 'true' && inputs.shorebird-version != '' && runner.os == 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path-windows.outputs.path }}
        VERSION: ${{ inputs.shorebird-version }}
      run: |
        if (Test-Path $env:INSTALL_PATH) { Remove-Item -Recurse -Force $env:INSTALL_PATH }
        $tag = "v" + $env:VERSION.TrimStart("v")
        git clone --quiet -c advice.detachedHead=false --branch $tag https://github.com/shorebirdtech/shorebird.git $env:INSTALL_PATH
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & (Join-Path $env:INSTALL_PATH "bin\shorebird.ps1") --version
      shell: pwsh

    # Adding the CLI to PATH is this action's job, so the GITHUB_PATH writes
    # below are intentional.
    - name: ➕ Add Shorebird to Path (MacOS / Linux)
      if: ${{ runner.os != 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path.outputs.path }}
      run: | # zizmor: ignore[github-env]
        echo "$INSTALL_PATH/bin" >> "$GITHUB_PATH"
        echo "added $INSTALL_PATH/bin to GITHUB_PATH"
      shell: bash

    - name: ➕ Add Shorebird to Path (Windows)
      if: ${{ runner.os == 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path-windows.outputs.path }}
      run: | # zizmor: ignore[github-env]
        Add-Content $env:GITHUB_PATH "$env:INSTALL_PATH\bin"
        Write-Output "added $env:INSTALL_PATH\bin to GITHUB_PATH"
      shell: pwsh

    - name: 🍄 Ensure Shorebird is Up-to-Date (MacOS / Linux)
      if: ${{ steps.cache-shorebird.outputs.cache-hit == 'true' && inputs.shorebird-version == '' && runner.os != 'Windows' }}
      run: shorebird upgrade
      shell: bash

    - name: 🍄 Ensure Shorebird is Up-to-Date (Windows)
      if: ${{ steps.cache-shorebird.outputs.cache-hit == 'true' && inputs.shorebird-version == '' && runner.os == 'Windows' }}
      run: shorebird upgrade
      shell: pwsh

    # Flutter lives under the installation (bin/cache/flutter/<revision>), so
    # the cache input covers it. Adding Flutter to PATH is this action's job,
    # so the GITHUB_PATH writes below are intentional.
    - name: 🐦 Install Flutter (MacOS / Linux)
      if: ${{ inputs.flutter-version != '' && runner.os != 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path.outputs.path }}
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: | # zizmor: ignore[github-env]
        args=(--flutter-version "$FLUTTER_VERSION")
        # `shorebird flutter <missing> --help` prints flutter's usage and exits
        # 0, so look for the subcommand in that usage instead.
        subcommands=$(shorebird flutter --help)
        has_subcommand() { grep -qE "^  $1 " <<< "$subcommands"; }
        if ! has_subcommand precache; then
          echo "::error::flutter-version needs Shorebird CLI 1.6.148 or later, which has shorebird flutter precache."
          exit 1
        fi
        shorebird flutter precache "${args[@]}"

        if has_subcommand path; then
          flutter_dir=$(shorebird flutter path "${args[@]}" | tail -n 1)
        else
          # The CLI's documented layout, for CLIs without `shorebird flutter
          # path`. Drop this once every supported CLI has that command. It
          # resolves the version as the CLI does: a release branch in the
          # default Flutter checkout, or a commit.
          revision=$(cat "$INSTALL_PATH/bin/internal/flutter.version")
          if [ "$FLUTTER_VERSION" != latest ]; then
            ref="refs/remotes/origin/flutter_release/$FLUTTER_VERSION"
            if [[ "$FLUTTER_VERSION" =~ ^[0-9a-fA-F]{4,40}$ ]]; then
              ref="$FLUTTER_VERSION"
            fi
            revision=$(git -C "$INSTALL_PATH/bin/cache/flutter/$revision" rev-parse "$ref")
          fi
          flutter_dir="$INSTALL_PATH/bin/cache/flutter/$revision"
        fi
        if [ ! -x "$flutter_dir/bin/flutter" ]; then
          echo "::error::Flutter is not at $flutter_dir."
          exit 1
        fi

        echo "$flutter_dir/bin" >> "$GITHUB_PATH"
        echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
        echo "added $flutter_dir/bin and the pub cache bin to GITHUB_PATH"
      shell: bash

    - name: 🐦 Install Flutter (Windows)
      if: ${{ inputs.flutter-version != '' && runner.os == 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path-windows.outputs.path }}
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: | # zizmor: ignore[github-env]
        $flutterArgs = @("--flutter-version", $env:FLUTTER_VERSION)
        # `shorebird flutter <missing> --help` prints flutter's usage and exits
        # 0, so look for the subcommand in that usage instead.
        $subcommands = shorebird flutter --help | Out-String
        if ($subcommands -notmatch '(?m)^  precache ') {
          Write-Output "::error::flutter-version needs Shorebird CLI 1.6.148 or later, which has shorebird flutter precache."
          exit 1
        }
        shorebird flutter precache @flutterArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        if ($subcommands -match '(?m)^  path ') {
          $flutterDir = shorebird flutter path @flutterArgs | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $flutterDir = $flutterDir.Trim()
        } else {
          # The CLI's documented layout, for CLIs without `shorebird flutter
          # path`. Drop this once every supported CLI has that command. It
          # resolves the version as the CLI does: a release branch in the
          # default Flutter checkout, or a commit.
          $cacheDir = Join-Path $env:INSTALL_PATH "bin\cache\flutter"
          $revision = (Get-Content (Join-Path $env:INSTALL_PATH "bin\internal\flutter.version") -Raw).Trim()
          if ($env:FLUTTER_VERSION -ne "latest") {
            $ref = "refs/remotes/origin/flutter_release/$env:FLUTTER_VERSION"
            if ($env:FLUTTER_VERSION -match '^[0-9a-fA-F]{4,40}$') { $ref = $env:FLUTTER_VERSION }
            $revision = git -C (Join-Path $cacheDir $revision) rev-parse $ref
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $revision = $revision.Trim()
          }
          $flutterDir = Join-Path $cacheDir $revision
        }
        if (-not (Test-Path (Join-Path $flutterDir "bin\flutter.bat"))) {
          Write-Output "::error::Flutter is not at $flutterDir."
          exit 1
        }

        $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path $env:LOCALAPPDATA "Pub\Cache" }
        Add-Content $env:GITHUB_PATH (Join-Path $flutterDir "bin")
        Add-Content $env:GITHUB_PATH (Join-Path $pubCache "bin")
        Write-Output "added $flutterDir\bin and the pub cache bin to GITHUB_PATH"
      shell: pwsh

name: ci
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔒 zizmor
        run: pipx run zizmor==1.30.1 --offline --config .github/zizmor.yml .

  e2e:
    name: e2e (${{ matrix.os }}${{ matrix.cache == false && ', no cache' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        cache: [true, false]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          cache: ${{ matrix.cache }}
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ $(shorebird --version) =~ "Engine • revision" ]]; then
            echo '✅ Shorebird CLI is installed!'
          else
            echo '❌ Shorebird CLI is not installed.'
            exit 1
          fi
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shorebird_version = shorebird --version
          if ($shorebird_version -match "Engine") {
            Write-Output "✅ Shorebird CLI is installed!"
          } else {
            Write-Output "❌ Shorebird CLI is not installed."
            exit 1
          }

  e2e-pinned:
    name: e2e pinned (${{ matrix.os }}${{ matrix.cache == false && ', no cache' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        cache: [true, false]

    runs-on: ${{ matrix.os }}
    env:
      # Any released version other than latest; must exist as a v<version> tag
      # in shorebirdtech/shorebird.
      PINNED_VERSION: 1.6.124
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          cache: ${{ matrix.cache }}
          shorebird-version: ${{ env.PINNED_VERSION }}
      - name: 🚦 Assert Pinned Version
        # pwsh on every OS so Windows runs shorebird.bat, not the bash script.
        shell: pwsh
        run: |
          $actual = shorebird --version | Out-String
          Write-Output $actual
          if ($actual -like "*Shorebird $env:PINNED_VERSION *") {
            Write-Output "✅ Shorebird $env:PINNED_VERSION is installed!"
          } else {
            Write-Output "❌ Expected Shorebird $env:PINNED_VERSION."
            exit 1
          }

  e2e-flutter-version:
    name: e2e flutter-version (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    env:
      # A Flutter version Shorebird supports other than the CLI's own.
      FLUTTER_VERSION: 3.38.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: 🚦 Assert Flutter Precached
        shell: pwsh
        run: |
          $root = Split-Path (Split-Path (Get-Command shorebird).Source)
          $stamps = Get-ChildItem (Join-Path $root "bin/cache/flutter") -Filter .shorebird_precache -Recurse -Depth 1 -Force
          if ($stamps.Count -ge 1) {
            Write-Output "✅ Flutter $env:FLUTTER_VERSION is precached."
          } else {
            Write-Output "❌ No precached Flutter in $root."
            exit 1
          }

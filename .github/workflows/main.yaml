name: ci
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-pull-request:
    permissions:
      pull-requests: read
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1.21.1

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔒 zizmor
        run: pipx run zizmor==1.30.1 --offline --config .github/zizmor.yml .

  e2e:
    name: e2e (${{ matrix.os }}${{ matrix.cache == false && ', no cache' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        cache: [true, false]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          cache: ${{ matrix.cache }}
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ $(shorebird --version) =~ "Engine • revision" ]]; then
            echo '✅ Shorebird CLI is installed!'
          else
            echo '❌ Shorebird CLI is not installed.'
            exit 1
          fi
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shorebird_version = shorebird --version
          if ($shorebird_version -match "Engine") {
            Write-Output "✅ Shorebird CLI is installed!"
          } else {
            Write-Output "❌ Shorebird CLI is not installed."
            exit 1
          }

  e2e-pinned:
    name: e2e pinned (${{ matrix.os }}${{ matrix.cache == false && ', no cache' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        cache: [true, false]

    runs-on: ${{ matrix.os }}
    env:
      # Any released version other than latest; must exist as a v<version> tag
      # in shorebirdtech/shorebird.
      PINNED_VERSION: 1.6.124
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          cache: ${{ matrix.cache }}
          version: ${{ env.PINNED_VERSION }}
      - name: 🚦 Assert Pinned Version
        # pwsh on every OS so Windows runs shorebird.bat, not the bash script.
        shell: pwsh
        run: |
          $actual = shorebird --version | Out-String
          Write-Output $actual
          if ($actual -like "*Shorebird $env:PINNED_VERSION *") {
            Write-Output "✅ Shorebird $env:PINNED_VERSION is installed!"
          } else {
            Write-Output "❌ Expected Shorebird $env:PINNED_VERSION."
            exit 1
          }

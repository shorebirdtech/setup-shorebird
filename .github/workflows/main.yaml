name: ci
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔒 zizmor
        run: pipx run zizmor==1.30.1 --offline --config .github/zizmor.yml .

  e2e:
    name: e2e (${{ matrix.os }}${{ matrix.cache == false && ', no cache' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        cache: [true, false]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          cache: ${{ matrix.cache }}
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ $(shorebird --version) =~ "Engine • revision" ]]; then
            echo '✅ Shorebird CLI is installed!'
          else
            echo '❌ Shorebird CLI is not installed.'
            exit 1
          fi
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shorebird_version = shorebird --version
          if ($shorebird_version -match "Engine") {
            Write-Output "✅ Shorebird CLI is installed!"
          } else {
            Write-Output "❌ Shorebird CLI is not installed."
            exit 1
          }

  e2e-pinned:
    name: e2e pinned (${{ matrix.os }}${{ matrix.cache == false && ', no cache' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        cache: [true, false]

    runs-on: ${{ matrix.os }}
    env:
      # Any released version other than latest; must exist as a v<version> tag
      # in shorebirdtech/shorebird.
      PINNED_VERSION: 1.6.124
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          cache: ${{ matrix.cache }}
          shorebird-version: ${{ env.PINNED_VERSION }}
          # This CLI has no flutter precache; its own Flutter still goes on PATH.
          flutter-version: latest
      - name: 🚦 Assert Flutter Is on PATH Without Precache
        shell: pwsh
        run: |
          flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 🚦 Assert Pinned Version
        # pwsh on every OS so Windows runs shorebird.bat, not the bash script.
        shell: pwsh
        run: |
          $actual = shorebird --version | Out-String
          Write-Output $actual
          if ($actual -like "*Shorebird $env:PINNED_VERSION *") {
            Write-Output "✅ Shorebird $env:PINNED_VERSION is installed!"
          } else {
            Write-Output "❌ Expected Shorebird $env:PINNED_VERSION."
            exit 1
          }

  e2e-flutter:
    name: e2e flutter (${{ matrix.os }}${{ matrix.cache == false && ', no cache' || '' }}${{ matrix.flutter-version != 'latest' && format(', {0}', matrix.flutter-version) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        cache: [true, false]
        flutter-version: [latest]
        # A version other than the CLI's own, to cover version resolution.
        # Must be in `shorebird flutter versions list`.
        include:
          - { os: macos-latest, cache: false, flutter-version: 3.38.5 }
          - { os: ubuntu-latest, cache: false, flutter-version: 3.38.5 }
          - { os: windows-latest, cache: false, flutter-version: 3.38.5 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          cache: ${{ matrix.cache }}
          flutter-version: ${{ matrix.flutter-version }}
      - name: 🚦 Assert Shorebird's Flutter Is on PATH
        # pwsh on every OS so Windows runs flutter.bat, not the bash script.
        shell: pwsh
        env:
          FLUTTER_VERSION: ${{ matrix.flutter-version }}
        run: |
          $flutter = (Get-Command flutter).Source
          Write-Output "flutter: $flutter"
          if ($flutter -notlike "*shorebird*") {
            Write-Output "❌ flutter on PATH is not Shorebird's."
            exit 1
          }
          $version = flutter --version | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $version
          if ($env:FLUTTER_VERSION -ne "latest" -and $version -notlike "*Flutter $env:FLUTTER_VERSION *") {
            Write-Output "❌ Expected Flutter $env:FLUTTER_VERSION."
            exit 1
          }
          dart --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "✅ Shorebird's Flutter is on PATH!"
